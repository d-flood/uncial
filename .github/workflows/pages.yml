name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The docs site is this repository's first consumer of the reusable workflow,
  # and the live exercise of it. It uploads a plain artifact rather than the
  # Pages one because the Pages site is the landing site with the docs nested
  # under /docs, so the merge below has to happen before anything is deployed.
  docs:
    uses: ./.github/workflows/static-site.yml
    with:
      package-filter: uncial-docs
      base-path: /${{ github.event.repository.name }}/docs
      # The gate is uncial-cms's published bin, which lives in its dist. In a
      # workspace that dist does not exist when pnpm links bins, so the link has
      # to be made again after packaging; a consumer installing from npm gets
      # dist in the tarball and needs none of this.
      pre-build: pnpm --filter uncial-cms run package && pnpm --filter uncial-docs rebuild
      pnpm-version: 11.15.1
      artifact-name: docs-build
      deploy: false

  build:
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: BASE_PATH=/${{ github.event.repository.name }} pnpm run build

      - name: Merge docs into Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: packages/uncial/build/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/uncial/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
